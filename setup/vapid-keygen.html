<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game With Me - notification key generator</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #0d1017; color: #eef1f6; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button { font: inherit; font-weight: 600; background: #2bd576; color: #06210f; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
  textarea { width: 100%; font: 14px ui-monospace, monospace; background: #161b26; color: #eef1f6; border: 1px solid #262d3b; border-radius: 10px; padding: 10px; margin: 6px 0 18px; }
  .warn { color: #f5d76e; }
  label { font-weight: 600; }
</style>
</head>
<body>
<h1>Notification keys</h1>
<p>Makes the key pair that lets your backend send push notifications. Everything happens in this browser tab; nothing is uploaded.</p>
<p><button id="go">Generate keys</button></p>
<div id="out" hidden>
  <label>Public key: paste into <code>config.js</code> as VAPID_PUBLIC_KEY, and into Supabase as the secret VAPID_PUBLIC_KEY</label>
  <textarea id="pub" rows="2" readonly></textarea>
  <label>Private key: paste into Supabase as the secret VAPID_PRIVATE_KEY</label>
  <textarea id="priv" rows="2" readonly></textarea>
  <p class="warn">Keep the private key out of GitHub and do not share it. Generate once only: new keys would log every phone out of notifications.</p>
</div>
<script>
  const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  document.getElementById('go').onclick = async () => {
    const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    document.getElementById('pub').value = b64url(await crypto.subtle.exportKey('raw', pair.publicKey));
    document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', pair.privateKey)).d;
    document.getElementById('out').hidden = false;
  };
</script>
</body>
</html>
